<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Card Select</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="card-selector">

        <!-- Secondary card bodies -->

        <div
            class="card-hand"
            id="card-hand"
        ></div>


        <!-- Secondary card titles -->

        <div
            class="card-labels"
            id="card-labels"
        ></div>


        <!-- Current card -->

        <div
            class="card current-card"
            id="current-card"
        >

            <div class="card-content">

                <h2 id="card-title">
                    CARD 1
                </h2>

                <p id="card-text">
                    This is the first card.
                </p>

            </div>


            <div class="line top"></div>

            <div class="line right"></div>

            <div class="line bottom"></div>

            <div class="line left"></div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
